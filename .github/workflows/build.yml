# Сборка Windows- и Mac-версий по тегу вида v1.0.0 и публикация файлов в релиз GitHub.
name: Сборка

on:
  push:
    tags: ['v*']
  workflow_dispatch: # можно запустить вручную на вкладке Actions (файлы будут в Artifacts)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: dist/*.exe
          # сервер на Apple Silicon; .dmg — universal (Apple Silicon + Intel)
          - os: macos-latest
            script: build:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # бинарник Electron для запуска не нужен, сборщик скачает свой
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # подписи кода нет — не ищем сертификаты
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log

      # конец лога сборки — в аннотацию ошибки, её видно без входа в GitHub
      - name: Показать ошибку сборки
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Лог сборки::${msg}"

      - name: Сохранить файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: planer-${{ matrix.os }}
          path: ${{ matrix.files }}

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: false
