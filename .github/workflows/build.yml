# Сборка Windows- и Mac-версий по тегу вида v1.0.0 и публикация файлов в релиз GitHub.
name: Сборка

on:
  push:
    tags: ['v*']
  workflow_dispatch: # можно запустить вручную на вкладке Actions (файлы будут в Artifacts)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: dist/*.exe
          # macos-latest (arm64) часто стоит в очереди из-за нехватки серверов;
          # на Intel-сервере собирается такой же universal .dmg (Intel + Apple Silicon)
          - os: macos-15-intel
            script: build:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # бинарник Electron для запуска не нужен, сборщик скачает свой
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # подписи кода нет — не ищем сертификаты
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - name: Сохранить файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: planer-${{ matrix.os }}
          path: ${{ matrix.files }}

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: false
